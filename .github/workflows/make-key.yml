name: Create upload key (run once)

on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create keystore
        run: |
          keytool -genkeypair -v -keystore miro-upload.jks -storetype PKCS12 \
            -alias miro -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Miro, O=Miro, C=IN"
          base64 -w0 miro-upload.jks > miro-upload.jks.base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Miro-upload-key
          path: |
            miro-upload.jks
            miro-upload.jks.base64.txt
