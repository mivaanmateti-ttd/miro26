name: Build Miro AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Android project
        id: find
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle not found"; exit 1; fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Decode upload key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon

      - name: Verify the bundle is signed
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -q "META-INF/.*\.RSA\|META-INF/.*\.SF" \
            && echo "Signed OK" || { echo "::error::Bundle is NOT signed"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Miro-AAB
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/bundle/release/app-release.aab
